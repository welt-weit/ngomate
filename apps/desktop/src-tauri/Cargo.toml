[package]
name = "ngomate-desktop"
version = "0.0.3"
description = "NGOmate desktop app"
license = "MIT"
edition = "2021"
rust-version = "1.80.0"

[lib]
name = "ngomate_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.10"
# Tauri's generated code reads the plugin settings in tauri.conf.json with it.
serde_json = "1"
tauri-plugin-ngomate = { path = "../../../packages/tauri" }

# Small over fast: the app waits on the model, not on this code. Unwinding stays on, because reading a
# broken PDF relies on catching a panic.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace]
