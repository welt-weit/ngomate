name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      # The interface's tests run against the built core.
      - run: yarn build
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

  # The Rust side on each system it ships for, so a Windows or Linux difference shows before a release.
  # Started by hand for now; remove the condition to run it on every push.
  native:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # An exact version, so a release never picks up a new compiler unnoticed.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/tauri
      - name: Install the Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev pkg-config
      # The model server the installers bundle, and a tiny test model, so one test can start the real server
      # the way the app does. These machines have no graphics card, which is the no-Vulkan case: the server
      # has to fall back to the processor by itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Fetch the model server and a test model
        shell: bash
        run: |
          node scripts/fetch-runtime.mjs
          server="$GITHUB_WORKSPACE/apps/desktop/src-tauri/runtime/llama-server"
          if [ "$RUNNER_OS" = Windows ]; then server="$server.exe"; fi
          echo "NGOMATE_SMOKE_SERVER=$server" >> "$GITHUB_ENV"
          echo "NGOMATE_SMOKE_MODEL=$(node scripts/fetch-test-model.mjs)" >> "$GITHUB_ENV"
      - name: Show the devices the model server finds
        shell: bash
        run: '"$NGOMATE_SMOKE_SERVER" --list-devices'
      - run: cargo test
        working-directory: packages/tauri
