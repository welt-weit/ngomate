[package]
name = "tauri-plugin-ngomate"
version = "0.0.1"
description = "Local model runner, downloads, keychain and files for NGOmate hosts"
license = "MIT"
edition = "2021"
rust-version = "1.80.0"
links = "tauri-plugin-ngomate"

[lib]
path = "rust/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }

[dependencies]
tauri = { version = "2.10" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.37"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
